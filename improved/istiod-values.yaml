profile: ambient
pilot:
  env:
    ENABLE_INGRESS_WAYPOINT_ROUTING: true
    PILOT_ENABLE_ALPHA_GATEWAY_API: true
    #PILOT_HTTP10: true
    # Small per-stream window: caps each tenant's in-flight HBONE data (~64 KiB),
    # which is the backpressure lever toward non-flow-controlled (TCP/HTTP1) senders.
    PILOT_HBONE_INITIAL_STREAM_WINDOW_SIZE: "65535"
    # Large per-connection window: gives many multiplexed streams headroom so a few
    # slow tenants don't exhaust the shared window and stall everyone (HOLB). Raised
    # from 262140 to 4 MiB during HOLB testing — predicted stall threshold ~= conn/stream
    # window ratio (~64 streams). Decoupled from the per-stream cap above.
    PILOT_HBONE_INITIAL_CONNECTION_WINDOW_SIZE: "4194304"
    # Cap streams multiplexed per HBONE CONNECT upstream connection. 1 = full
    # per-tunnel isolation (no cross-tenant head-of-line blocking). Requires a
    # patched pilot exposing this flag (stock istio has no equivalent knob), so it
    # is NOT active on the current stock 1.29.3 istiod — left here as the intended
    # value once the patched pilot (istiolocal/pilot:mcs) is deployed.
    PILOT_HBONE_MAX_CONCURRENT_STREAMS: 1
meshConfig:
  defaultConfig:
    proxyStatsMatcher:
      inclusionRegexps:
        - ".*"
  discoverySelectors:
    - matchLabels:
        istio-discovery: enabled
  hboneIdleTimeout: 15s
